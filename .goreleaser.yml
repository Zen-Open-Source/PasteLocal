version: 2

project_name: pastelocal

before:
  hooks:
    - go mod tidy

builds:
  - id: pastelocal
    main: ./cmd/pastelocal
    binary: pastelocal
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath

  - id: pastelocald
    main: ./cmd/pastelocald
    binary: pastelocald
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath

  - id: pastelocal-remote
    main: ./cmd/pastelocal-remote
    binary: pastelocal-remote
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath

archives:
  - id: default
    builds:
      - pastelocal
      - pastelocald
    name_template: >-
      {{ .ProjectName }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format: tar.gz
    files:
      - LICENSE
      - skill/paste.md

  - id: remote
    builds:
      - pastelocal-remote
    name_template: >-
      {{ .ProjectName }}-remote_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format: tar.gz
    files:
      - LICENSE
      - skill/paste.md

checksum:
  name_template: SHA256SUMS

sboms:
  - id: default
    artifacts: archive

release:
  github:
    owner: pastelocal
    name: pastelocal

brews:
  - name: pastelocal
    repository:
      owner: pastelocal
      name: tap
      branch: main
    directory: Formula
    homepage: https://github.com/pastelocal/pastelocal
    description: Clipboard bridge for Claude Code over SSH
    license: MIT
    install: |
      bin.install "pastelocal"
      bin.install "pastelocald"
    test: |
      assert_match version, shell_output("#{bin}/pastelocal --version")
