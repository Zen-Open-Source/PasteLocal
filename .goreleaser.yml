version: 2

project_name: pastelocal

before:
  hooks:
    - go mod tidy

builds:
  - id: pastelocal
    main: ./cmd/pastelocal
    binary: pastelocal
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath

  - id: pastelocald
    main: ./cmd/pastelocald
    binary: pastelocald
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath

  - id: pastelocal-remote
    main: ./cmd/pastelocal-remote
    binary: pastelocal-remote
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath

archives:
  - id: default
    ids:
      - pastelocal
      - pastelocald
    name_template: >-
      {{ .ProjectName }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    files:
      - LICENSE
      - skill/paste.md
      - skill/paste-send.md

  - id: remote
    ids:
      - pastelocal-remote
    name_template: >-
      {{ .ProjectName }}-remote_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    files:
      - LICENSE
      - skill/paste.md
      - skill/paste-send.md

checksum:
  name_template: SHA256SUMS

sboms:
  - id: default
    artifacts: archive

signs:
  - cmd: cosign
    args:
      - "sign-blob"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: archive
    certificate: ""

dockers:
  - id: remote-amd64
    ids:
      - pastelocal-remote
    dockerfile: Dockerfile.remote
    build_flag_templates:
      - "--platform=linux/amd64"
    image_templates:
      - "ghcr.io/zen-open-source/pastelocal-remote:{{ .Version }}-amd64"
      - "ghcr.io/zen-open-source/pastelocal-remote:latest-amd64"
    goos: linux
    goarch: amd64

  - id: remote-arm64
    ids:
      - pastelocal-remote
    dockerfile: Dockerfile.remote
    build_flag_templates:
      - "--platform=linux/arm64"
    image_templates:
      - "ghcr.io/zen-open-source/pastelocal-remote:{{ .Version }}-arm64"
      - "ghcr.io/zen-open-source/pastelocal-remote:latest-arm64"
    goos: linux
    goarch: arm64

docker_manifests:
  - id: remote-manifest
    name_template: "ghcr.io/zen-open-source/pastelocal-remote:{{ .Version }}"
    image_templates:
      - "ghcr.io/zen-open-source/pastelocal-remote:{{ .Version }}-amd64"
      - "ghcr.io/zen-open-source/pastelocal-remote:{{ .Version }}-arm64"

nfpms:
  - id: remote
    ids:
      - pastelocal-remote
    package_name: pastelocal-remote
    vendor: pastelocal
    homepage: https://github.com/Zen-Open-Source/PasteLocal
    maintainer: pastelocal contributors
    description: Remote helper for pastelocal clipboard bridge
    license: MIT
    formats:
      - deb
      - rpm
    file_name_template: >-
      {{ .PackageName }}_
      {{- .Version }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

release:
  github:
    owner: Zen-Open-Source
    name: PasteLocal
  mode: replace

# Homebrew tap configuration
# We publish under the Zen-Open-Source organization for consistency
# with other open source projects released under this org.
brews:
  - name: pastelocal
    repository:
      owner: Zen-Open-Source
      name: tap
      branch: main
    directory: Formula
    homepage: https://github.com/Zen-Open-Source/PasteLocal
    description: Clipboard bridge for agentic coding tools over SSH
    license: MIT
    install: |
      bin.install "pastelocal"
      bin.install "pastelocald"
    test: |
      assert_match version, shell_output("#{bin}/pastelocal --version")
